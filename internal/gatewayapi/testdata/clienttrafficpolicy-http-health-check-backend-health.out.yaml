        hostname: '*'
        isHTTP2: false
        metadata:
          kind: HTTPRoute
          name: http-route-3
          namespace: default
        name: httproute/default/http-route-3/rule/0/match/0/*
        pathMatch:
          distinct: false
          name: ""
          prefix: /down
      - hostname: '*'
